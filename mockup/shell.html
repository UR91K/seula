<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seula shell board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="board.css">
</head>
<body>
<script src="data/mock-api.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="screens.js"></script>
<script src="board.js"></script>
<script>
  // The approved shell (ADR-0032), on the board layout (ADR-0036). The light theme is
  // the board's theme toggle, not a frame of its own.
  const scanning = data.projects[40];

  board({
    title: "Seula · Shell",
    intro: `<p>The frame alone: two full-width bars, and the sidebar, main area and inspector
      between them (ADR-0032). The projects table is here only as a density sample; the view
      itself is on the <a href="projects.html">projects board</a>.</p>`,
    columns: [
      { title: "Screen", frames: [
        { id: "1", label: "Inspector open, one row selected", note: "Tauri target with window controls", kind: "screen", live: true,
          render: projectsScreen(projectsState({ selected: new Set([data.projects[8].id]) })) },
        { id: "1b", label: "Sidebar collapsed, inspector closed, scanning", note: "the sidebar keeps its icons, never zero width", kind: "screen", live: true,
          render: projectsScreen(projectsState({ sidebarCollapsed: true, inspectorOpen: false, selected: new Set(data.projects.slice(3, 6).map((p) => p.id)),
            scan: { done: 112, total: data.projects.length, message: `Parsed ${fileStem(scanning.path)}.als (112/${data.projects.length})` } })) },
        { id: "1c", label: "Stats", note: "the one view with no inspector, so no toggle either", kind: "screen",
          render: (el) => { el.innerHTML = renderShell({ view: "stats", tauri: true, viewbar: "<h1>Stats</h1>",
            content: `<div class="placeholder">Stats view · built after the other four</div>`,
            status: [`${data.projects.length} projects · ${data.plugins.length} plugins · ${data.samples.length} samples`] }); } },
      ]},
    ],
  });
</script>
</body>
</html>
