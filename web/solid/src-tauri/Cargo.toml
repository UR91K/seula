# Deliberately NOT a member of the root workspace (ADR-0048): Tauri's dependency tree is
# large, and `cargo build/test --workspace` should not compile it. Own lockfile; the target directory is shared (web/.cargo/config.toml).
[package]
name = "seula-shell-solid"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The snap-layout overlay (ADR-0054, src/snap.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
