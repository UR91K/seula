syntax = "proto3";

package seula.plugins;

import "common.proto";

service PluginService {
  rpc GetAllPlugins(GetAllPluginsRequest) returns (GetAllPluginsResponse);
  rpc GetPluginByInstalledStatus(GetPluginByInstalledStatusRequest)
      returns (GetPluginByInstalledStatusResponse);
  rpc SearchPlugins(SearchPluginsRequest) returns (SearchPluginsResponse);
  rpc GetPluginStats(GetPluginStatsRequest) returns (GetPluginStatsResponse);
  rpc GetProjectsByPlugin(GetProjectsByPluginRequest)
      returns (GetProjectsByPluginResponse);
  rpc RefreshPluginInstallationStatus(RefreshPluginInstallationStatusRequest)
      returns (RefreshPluginInstallationStatusResponse);
  rpc GetPluginVendors(GetPluginVendorsRequest) returns (GetPluginVendorsResponse);
  rpc GetPluginFormats(GetPluginFormatsRequest) returns (GetPluginFormatsResponse);
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse);
}

// Which of the three `plugins.installed` categories a query should return.
//
// `installed` is tri-state: a scan found it, a scan looked and did not, or no scan has
// looked yet. Filters carry a repeated field so unions are expressible -- "everything I
// cannot load" is ABSENT plus UNSCANNED. An empty list means no filtering. See ADR-0025.
enum InstallState {
  INSTALL_STATE_UNSPECIFIED = 0;
  // A scan confirmed the plugin is installed.
  INSTALL_STATE_INSTALLED = 1;
  // A scan looked for the plugin and did not find it.
  INSTALL_STATE_ABSENT = 2;
  // No scan has looked. Deliberately distinct from ABSENT.
  INSTALL_STATE_UNSCANNED = 3;
}

message GetAllPluginsRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
  optional string sort_by = 3;  // name, vendor, installed, usage_count
  optional bool sort_desc = 4;
  optional string vendor_filter = 5;
  optional string format_filter = 6;
  repeated InstallState install_states = 7;
  optional int32 min_usage_count = 8;
}

message GetAllPluginsResponse {
  repeated seula.common.Plugin plugins = 1;
  int32 total_count = 2;
}

// Filter by Status
message GetPluginByInstalledStatusRequest {
  repeated InstallState install_states = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
  optional string sort_by = 4;
  optional bool sort_desc = 5;
}

message GetPluginByInstalledStatusResponse {
  repeated seula.common.Plugin plugins = 1;
  int32 total_count = 2;
}

// Search
message SearchPluginsRequest {
  string query = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
  repeated InstallState install_states = 4;
  optional string vendor_filter = 5;
  optional string format_filter = 6;
}

message SearchPluginsResponse {
  repeated seula.common.Plugin plugins = 1;
  int32 total_count = 2;
}

// Stats for Status Bar
message GetPluginStatsRequest {}

message GetPluginStatsResponse {
  int32 total_plugins = 1;
  int32 installed_plugins = 2;
  int32 missing_plugins = 3;
  int32 unique_vendors = 4;
  map<string, int32> plugins_by_format = 5;  // VST3, VST, AU, etc.
  map<string, int32> plugins_by_vendor = 6;
  // Plugins no scan has looked for yet, distinct from looked-for-and-absent.
  // installed + missing + unknown == total.
  int32 unknown_plugins = 7;
}



message GetProjectsByPluginRequest {
  string plugin_id = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

message GetProjectsByPluginResponse {
  repeated seula.common.Project projects = 1;
  int32 total_count = 2;
}

// Plugin Installation Status Refresh
message RefreshPluginInstallationStatusRequest {}

message RefreshPluginInstallationStatusResponse {
  // Plugin binaries the scan attempted to load.
  int32 candidates_scanned = 1;
  // Rows the scan confirmed are installed.
  int32 plugins_installed = 2;
  // Rows a full scan looked for and did not find.
  int32 plugins_missing = 3;
  // Binaries that would not load. Usually genuinely broken, worth surfacing.
  int32 scan_failures = 4;
  bool success = 5;
  optional string error_message = 6;
  // Duplicate rows merged into the bundle that actually exports their class.
  int32 plugins_reconciled = 7;
}

// Get Plugin Vendors
message GetPluginVendorsRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
  optional string sort_by = 3;  // vendor, plugin_count, usage_count
  optional bool sort_desc = 4;
}

message GetPluginVendorsResponse {
  repeated VendorInfo vendors = 1;
  int32 total_count = 2;
}

message VendorInfo {
  string vendor = 1;
  int32 plugin_count = 2;
  int32 installed_plugins = 3;
  int32 missing_plugins = 4;
  int32 total_usage_count = 5;
  int32 unique_projects_using = 6;
  map<string, int32> plugins_by_format = 7;  // format -> count
  // Plugins no scan has looked for yet, distinct from looked-for-and-absent.
  // installed + missing + unknown == plugin_count.
  int32 unknown_plugins = 8;
}

// Get Plugin Formats
message GetPluginFormatsRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
  optional string sort_by = 3;  // format, plugin_count, usage_count
  optional bool sort_desc = 4;
}

message GetPluginFormatsResponse {
  repeated FormatInfo formats = 1;
  int32 total_count = 2;
}

message FormatInfo {
  string format = 1;
  int32 plugin_count = 2;
  int32 installed_plugins = 3;
  int32 missing_plugins = 4;
  int32 total_usage_count = 5;
  int32 unique_projects_using = 6;
  map<string, int32> plugins_by_vendor = 7;  // vendor -> count
  // Plugins no scan has looked for yet, distinct from looked-for-and-absent.
  // installed + missing + unknown == plugin_count.
  int32 unknown_plugins = 8;
}

// Get Individual Plugin
message GetPluginRequest {
  string plugin_id = 1;
}

message GetPluginResponse {
  seula.common.Plugin plugin = 1;
  int32 usage_count = 2;
  int32 project_count = 3;
}